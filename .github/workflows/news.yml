name: Stock News Agent

on:
  schedule:
    - cron: '*/15 12-22 * * 1-5'   # Urgent: every 15 min, US market hours, weekdays
    - cron: '0 13 * * 1-5'         # Daily brief: 13:00 UTC = 20:00 Bangkok
  workflow_dispatch:                # allow manual trigger

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: seen_items.json
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      - run: pip install google-genai feedparser requests

      - name: Pick mode
        id: mode
        run: |
          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "13" ] && [ "$MIN" -lt "10" ]; then
            echo "mode=daily" >> $GITHUB_OUTPUT
          else
            echo "mode=urgent" >> $GITHUB_OUTPUT
          fi

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_agent.py ${{ steps.mode.outputs.mode }}

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_items.json
          key: news-cache-${{ github.run_id }}
