name: Stock Scout Agent

on:
  schedule:
    - cron: '0 */4 * * 1-5'      # scout: every 4h, weekdays
    - cron: '30 11 * * 1-5'      # deep: 11:30 UTC = 18:30 BKK, weekdays
    - cron: '*/15 * * * *'       # listen: every 15 min, all days
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'listen'
        type: choice
        options: [scout, deep, listen]

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: scout_cache.json
          key: scout-cache-${{ github.run_id }}
          restore-keys: scout-cache-

      - run: pip install google-genai feedparser requests yfinance pandas numpy

      - name: Pick mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DOW=$(date -u +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$HOUR" = "11" ] && [ "$MIN" = "30" ] && [ "$DOW" -le 5 ]; then
            MODE=deep
          elif [ "$MIN" = "00" ] && [ "$DOW" -le 5 ] && \
               { [ "$HOUR" = "00" ] || [ "$HOUR" = "04" ] || [ "$HOUR" = "08" ] || \
                 [ "$HOUR" = "12" ] || [ "$HOUR" = "16" ] || [ "$HOUR" = "20" ]; }; then
            MODE=scout
          else
            MODE=listen
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scout_agent.py ${{ steps.mode.outputs.mode }}

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scout_cache.json
          key: scout-cache-${{ github.run_id }}
