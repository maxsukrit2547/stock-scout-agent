name: Stock Scout Agent

on:
  schedule:
    - cron: '0 */4 * * 1-5'      # scout:  every 4h, weekdays
    - cron: '30 11 * * 1-5'      # deep:   18:30 BKK (11:30 UTC), weekdays
    - cron: '*/15 * * * 1-5'     # listen: every 15 min, weekdays only
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'deep'
        type: choice
        options: [scout, deep, listen]

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: scout_cache.json
          key: scout-cache-${{ github.run_id }}
          restore-keys: scout-cache-

      - run: pip install google-genai feedparser requests yfinance pandas numpy

      - name: Pick mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DOW=$(date -u +%u)
          TOTAL_MIN=$(( HOUR * 60 + MIN ))

          echo "UTC time: ${HOUR}:${MIN} (${TOTAL_MIN} min), DOW: ${DOW}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"

          # Deep window: 18:30–23:59 BKK = 11:30–16:59 UTC (TOTAL_MIN 690–1019)
          elif [ "$DOW" -le 5 ] && [ "$TOTAL_MIN" -ge 690 ] && [ "$TOTAL_MIN" -le 1019 ]; then
            MODE=deep

          # Scout: top of every 4th hour on weekdays
          elif [ "$MIN" = "00" ] && [ "$DOW" -le 5 ]; then
            case "$HOUR" in
              00|04|08|12|16|20) MODE=scout ;;
              *) MODE=listen ;;
            esac

          else
            MODE=listen
          fi

          echo "Selected mode: $MODE"
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scout_agent.py ${{ steps.mode.outputs.mode }}

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scout_cache.json
          key: scout-cache-${{ github.run_id }}
