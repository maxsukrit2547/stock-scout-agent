name: Stock Scout Agent

on:
  schedule:
    - cron: '0 */4 * * 1-5'     # scout: every 4h, weekdays
    - cron: '*/15 * * * 1-5'    # listen: every 15 min, weekdays
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'listen'
        type: choice
        options: [scout, listen]

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: scout_cache.json
          key: scout-cache-${{ github.run_id }}
          restore-keys: scout-cache-

      - run: pip install google-genai feedparser requests yfinance pandas numpy

      - name: Pick mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DOW=$(date -u +%u)

          echo "UTC time: ${HOUR}:${MIN}, DOW: ${DOW}, event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "$MIN" = "00" ] && [ "$DOW" -le 5 ]; then
            case "$HOUR" in
              00|04|08|12|16|20) MODE=scout ;;
              *) MODE=listen ;;
            esac
          else
            MODE=listen
          fi

          echo "Selected mode: $MODE"
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scout_agent.py ${{ steps.mode.outputs.mode }}

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scout_cache.json
          key: scout-cache-${{ github.run_id }}
